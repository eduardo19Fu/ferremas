#CONFIGURACION DEL PUERTO DEL SERVIDOR
server.port=${PORT:8082}

# DATASOURCE (MYSQL 8.0)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#LOCAL
spring.datasource.url=jdbc:mysql://localhost:3306/ferremas_db?useSSL=false&serverTimezone=America/Guatemala&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1992

#JPA
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

#PROPIEDADES
ferremas.origins=http://localhost:4200

#TIMEZONE
#CONFIGURAR TIMEZONE EN SERVIDOR CON COMANDO: heroku config:add TZ="America/Guatemala"
spring.jackson.time-zone=America/Guatemala
spring.jackson.locale=es_GT

#Subida de Imagenes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#LOGGING
logging.level.root=INFO
logging.level.com.aglayatech.licorstore=DEBUG

logging.file.name=c:/pangosoft/ferremas/logs/ferremas-log

# --- Autenticacion (JWT propio, compatible con el flujo /oauth/token anterior) ---
ferremas.auth.client-id=angularapp
# Credenciales del cliente Angular. Debe coincidir con el frontend; se puede sobreescribir por entorno.
ferremas.auth.client-secret=${FERREMAS_AUTH_CLIENT_SECRET:pangosoftpuntodeventastore2021}
ferremas.auth.access-token-ttl=12h
ferremas.auth.refresh-token-ttl=30d
# Claves RSA en PEM (privada PKCS#8, publica X.509). NO subirlas al repositorio. Si faltan se genera
# un par efimero al arrancar (solo desarrollo). Ej.: file:/ruta/segura/jwt-private.pem
#ferremas.auth.private-key=${FERREMAS_AUTH_PRIVATE_KEY}
#ferremas.auth.public-key=${FERREMAS_AUTH_PUBLIC_KEY}
