<aside class="main-sidebar fm-sidebar elevation-0">

  <!-- Marca -->
  <a [routerLink]="['/home']" class="fm-brand" aria-label="Ferremas, ir al inicio">
    <app-logo class="fm-brand__full" variant="light" layout="inline" size="sm"></app-logo>
    <svg class="fm-brand__mark" viewBox="0 0 128 128" aria-hidden="true">
      <g transform="translate(6 14) scale(.9)">
        <g transform="rotate(-20 42 40)">
          <rect x="39" y="2" width="6" height="15" rx="3" fill="#d8384c"/>
          <path d="M33 24h18l-9 20z" fill="#e4eaf0"/>
        </g>
        <g transform="rotate(17 104 40)">
          <rect x="99" y="0" width="10" height="17" rx="4" fill="#d8384c"/>
          <rect x="102" y="16" width="4" height="26" rx="2" fill="#e4eaf0"/>
        </g>
        <path d="M46 42c0-17 7-25 18-25s18 8 18 25z" fill="#f4be4a"/>
        <rect x="41" y="38" width="46" height="6" rx="3" fill="#dd9f2c"/>
        <path d="M26 44h78l-12 31q-2 5-7 5H45q-5 0-7-5z" fill="#d8384c"/>
        <rect x="22" y="39" width="86" height="8" rx="4" fill="#ee5468"/>
        <circle cx="113" cy="87" r="15" fill="#1d2833" stroke="rgba(255,255,255,.3)" stroke-width="1.6"/>
        <circle cx="113" cy="87" r="5" fill="#e4eaf0"/>
      </g>
    </svg>
  </a>

  <div class="sidebar fm-sidebar__body">

    <!-- Usuario -->
    <div class="fm-user" *ngIf="usuario">
      <span class="fm-user__avatar" aria-hidden="true">{{ iniciales }}</span>
      <span class="fm-user__info">
        <span class="fm-user__name">{{ nombreCompleto }}</span>
        <span class="fm-user__role">{{ rolEtiqueta }}</span>
      </span>
    </div>

    <!-- Buscador -->
    <div class="fm-search">
      <i class="fas fa-search" aria-hidden="true"></i>
      <input type="search" class="fm-search__input" placeholder="Buscar en el menú"
             aria-label="Buscar en el menú" autocomplete="off"
             [(ngModel)]="filtro" (ngModelChange)="actualizar()" (keydown.escape)="limpiar()">
      <button type="button" class="fm-search__clear" *ngIf="filtro" (click)="limpiar()" aria-label="Limpiar búsqueda">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <nav class="fm-nav" aria-label="Menú principal">

      <p class="fm-empty" *ngIf="sinResultados">Sin coincidencias para “{{ filtro }}”.</p>

      <section class="fm-section" *ngFor="let seccion of vista">
        <h2 class="fm-section__title" *ngIf="seccion.titulo">{{ seccion.titulo }}</h2>

        <ul class="fm-list">
          <li class="fm-item" *ngFor="let item of seccion.items; trackBy: trackPorEtiqueta"
              [class.is-open]="item.hijos && estaAbierto(item)" [class.is-active]="esActivo(item)">

            <!-- enlace simple -->
            <a *ngIf="!item.hijos" class="fm-link" [routerLink]="[item.ruta]" routerLinkActive="is-current"
               [title]="item.etiqueta">
              <span class="fm-link__icon"><i class="fas" [ngClass]="item.icono"></i></span>
              <span class="fm-link__text">{{ item.etiqueta }}</span>
            </a>

            <!-- grupo -->
            <ng-container *ngIf="item.hijos">
              <a href="#" class="fm-link" role="button" [attr.aria-expanded]="estaAbierto(item)"
                 (click)="alternar(item, $event)" [title]="item.etiqueta">
                <span class="fm-link__icon"><i class="fas" [ngClass]="item.icono"></i></span>
                <span class="fm-link__text">{{ item.etiqueta }}</span>
                <i class="fas fa-chevron-right fm-link__chevron" aria-hidden="true"></i>
              </a>

              <ul class="fm-sub" *ngIf="estaAbierto(item)">
                <li *ngFor="let hijo of item.hijos; trackBy: trackPorEtiqueta">
                  <a class="fm-sublink" [routerLink]="[hijo.ruta]" routerLinkActive="is-current">
                    <span class="fm-sublink__dot" aria-hidden="true"></span>
                    {{ hijo.etiqueta }}
                  </a>
                </li>
              </ul>
            </ng-container>
          </li>
        </ul>
      </section>

      <!--
        Envios: modulo deshabilitado (nunca salio a produccion). No restaurar en el menu.
        Rutas: /envios/index, /envios/create
      -->
    </nav>

    <!-- Cerrar sesion -->
    <div class="fm-foot">
      <a class="fm-logout" [routerLink]="['/login']" title="Cerrar sesión">
        <span class="fm-link__icon"><i class="fas fa-sign-out-alt"></i></span>
        <span class="fm-link__text">Cerrar sesión</span>
      </a>
    </div>

  </div>
</aside>
