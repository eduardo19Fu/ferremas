<section class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1>{{title}}</h1>
                <br>
                <a [routerLink]="['/paises/create']" class="btn bg-gradient-success">
                    <i class="fas fa-plus-circle"></i>
                    Nuevo
                </a>
            </div>
        </div>
    </div>
</section>

<div class="card">
    <div class="card-header">
        Listado de Pa&iacute;ses Registrados
    </div>

    <div class="card-body table-responsive">
        <div class="row mb-2">
            <div class="col-md-4 ml-md-auto tm-buscador">
                <i class="fas fa-search"></i>
                <input type="search" class="form-control form-control-sm" placeholder="Buscar..."
                    [ngModel]="search" (ngModelChange)="onBuscar($event)">
                <span class="tm-spinner" *ngIf="cargando"></span>
            </div>
        </div>

        <app-sin-registros *ngIf="paises?.length === 0 && !cargando" entidad="países" [busqueda]="search"
            (limpiar)="onBuscar('')"></app-sin-registros>

        <div class="tabla-wrap">
            <div class="tabla-progreso" *ngIf="cargando && paises?.length"></div>
            <app-tabla-skeleton *ngIf="cargando && !paises?.length" [columnas]="3"></app-tabla-skeleton>
            <table id="paises" class="table table-modern" [class.cargando]="cargando"
            *ngIf="paises?.length > 0">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Pais</th>
                    <th>Opciones</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let pais of paises">
                    <td data-label="#">{{pais.idPais}}</td>
                    <td data-label="Pais">{{pais.nombre}}</td>
                    <td data-label="Opciones" class="center-options">

                        <button class="btn bg-gradient-info margin" placement="top" ngbTooltip="Editar"
                            [routerLink]="['/paises/create', pais.idPais]"
                            *ngIf="auth.hasRole('ROLE_ADMIN') || auth.hasRole('ROLE_INVENTARIO')">
                            <i class="fas fa-edit"></i>
                        </button>

                        <button class="btn bg-gradient-danger margin" placement="top" ngbTooltip="Eliminar"
                            *ngIf="auth.hasRole('ROLE_ADMIN') || auth.hasRole('ROLE_INVENTARIO')" (click)="delete(pais)">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>

        <app-paginacion [page]="page" [size]="size" [totalElements]="totalElements" [totalPages]="totalPages"
            (pageChange)="onPageChange($event)" (sizeChange)="onSizeChange($event)"></app-paginacion>
    </div>
</div>
