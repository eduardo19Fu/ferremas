<div class="modal fade" id="modal-anulaciones">
    <div class="modal-dialog">
        <div class="modal-content tm-form">
            <div class="modal-header">
                <h4 class="modal-title">{{title}}</h4>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <p class="tm-lead">Facturas, notas de crédito y compras anuladas, agrupadas por tipo de documento.</p>

                <form #formAnulaciones="ngForm" (ngSubmit)="onSubmit()">
                    <div class="tm-grid">
                        <div class="tm-field">
                            <label for="anu-fecha-ini">Fecha inicio</label>
                            <input type="date" class="form-control" name="fechaIni" id="anu-fecha-ini" [(ngModel)]="fechaIni" required>
                        </div>

                        <div class="tm-field">
                            <label for="anu-fecha-fin">Fecha fin</label>
                            <input type="date" class="form-control" name="fechaFin" id="anu-fecha-fin" [(ngModel)]="fechaFin" required>
                        </div>

                        <div class="tm-field">
                            <label for="anu-formato">Formato</label>
                            <select class="form-control custom-select" name="formato" id="anu-formato" [(ngModel)]="formato">
                                <option value="PDF">PDF</option>
                                <option value="XLSX">Excel</option>
                            </select>
                        </div>
                    </div>

                    <p class="tm-hint">La fecha mostrada es la del documento original: el sistema no registra cuándo se anuló.</p>
                    <p class="tm-hint text-danger" *ngIf="fechaIni && fechaFin && !rangoValido">
                        La fecha final no puede ser anterior a la fecha de inicio.
                    </p>

                    <button type="submit" class="btn btn-block bg-gradient-warning" [disabled]="!rangoValido || generando"
                        [class.is-loading]="generando" [attr.aria-busy]="generando">
                        <span class="tm-spinner tm-spinner--btn" *ngIf="generando; else icono" role="status"></span>
                        <ng-template #icono><i class="fas" [ngClass]="formato === 'PDF' ? 'fa-print' : 'fa-file-excel'"></i></ng-template>
                        {{ generando ? 'Generando…' : (formato === 'PDF' ? 'Imprimir' : 'Descargar Excel') }}
                    </button>
                </form>
            </div>
            <div class="modal-footer justify-content-between">
                <button type="button" class="btn btn-default" data-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
