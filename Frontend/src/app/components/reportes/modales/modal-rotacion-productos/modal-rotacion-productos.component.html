<div class="modal fade" id="modal-rotacion-productos">
    <div class="modal-dialog">
        <div class="modal-content tm-form">
            <div class="modal-header">
                <h4 class="modal-title">{{title}}</h4>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <p class="tm-lead">
                    {{ modo === 'MAS_VENDIDOS'
                        ? 'Ranking de los productos que más se vendieron en el período.'
                        : 'Productos con existencias que casi no se venden: dinero parado en bodega.' }}
                </p>

                <form #formRotacion="ngForm" (ngSubmit)="onSubmit()">
                    <div class="tm-grid">
                        <div class="tm-field tm-span-all">
                            <label for="rot-modo">Reporte</label>
                            <select class="form-control custom-select" name="modo" id="rot-modo" [(ngModel)]="modo">
                                <option value="MAS_VENDIDOS">Más vendidos</option>
                                <option value="BAJA_ROTACION">Baja rotación</option>
                            </select>
                        </div>

                        <div class="tm-field">
                            <label for="rot-fecha-ini">Fecha inicio</label>
                            <input type="date" class="form-control" name="fechaIni" id="rot-fecha-ini" [(ngModel)]="fechaIni" required>
                        </div>

                        <div class="tm-field">
                            <label for="rot-fecha-fin">Fecha fin</label>
                            <input type="date" class="form-control" name="fechaFin" id="rot-fecha-fin" [(ngModel)]="fechaFin" required>
                        </div>

                        <div class="tm-field">
                            <label for="rot-limite">Cantidad de productos</label>
                            <select class="form-control custom-select" name="limite" id="rot-limite" [(ngModel)]="limite">
                                <option *ngFor="let l of limites" [ngValue]="l">{{l}}</option>
                            </select>
                        </div>

                        <div class="tm-field" *ngIf="modo === 'MAS_VENDIDOS'">
                            <label for="rot-orden">Ordenar por</label>
                            <select class="form-control custom-select" name="orden" id="rot-orden" [(ngModel)]="orden">
                                <option value="CANTIDAD">Unidades vendidas</option>
                                <option value="IMPORTE">Importe vendido</option>
                            </select>
                        </div>

                        <div class="tm-field" *ngIf="modo === 'BAJA_ROTACION'">
                            <label for="rot-umbral">Vendieron como máximo (unidades)</label>
                            <input type="number" min="0" class="form-control" name="umbral" id="rot-umbral" [(ngModel)]="umbral">
                        </div>

                        <div class="tm-field">
                            <label for="rot-formato">Formato</label>
                            <select class="form-control custom-select" name="formato" id="rot-formato" [(ngModel)]="formato">
                                <option value="PDF">PDF</option>
                                <option value="XLSX">Excel</option>
                            </select>
                        </div>
                    </div>

                    <p class="tm-hint text-danger" *ngIf="fechaIni && fechaFin && !rangoValido">
                        La fecha final no puede ser anterior a la fecha de inicio.
                    </p>

                    <button type="submit" class="btn btn-block bg-gradient-warning" [disabled]="!rangoValido || generando"
                        [class.is-loading]="generando" [attr.aria-busy]="generando">
                        <span class="tm-spinner tm-spinner--btn" *ngIf="generando; else icono" role="status"></span>
                        <ng-template #icono><i class="fas" [ngClass]="formato === 'PDF' ? 'fa-print' : 'fa-file-excel'"></i></ng-template>
                        {{ generando ? 'Generando…' : (formato === 'PDF' ? 'Imprimir' : 'Descargar Excel') }}
                    </button>
                </form>
            </div>
            <div class="modal-footer justify-content-between">
                <button type="button" class="btn btn-default" data-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
