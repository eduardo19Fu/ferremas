<main class="login">

    <!-- FORMULARIO (izquierda) -->
    <section class="login__panel">
        <header class="login__top">
            <app-logo variant="dark" layout="inline" size="sm"></app-logo>
        </header>

        <div class="login__center">
            <div class="login__intro">
                <h1 class="login__title">{{ title }}</h1>
                <p class="login__lead">Ingresa tus credenciales para acceder al sistema.</p>
            </div>

            <form #loginForm="ngForm" (ngSubmit)="login()" class="tm-form login__form" novalidate>
                <div class="tm-field">
                    <label for="usuario">{{ usuarioTitle }}</label>
                    <div class="tm-input-icon">
                        <i class="fas fa-user" aria-hidden="true"></i>
                        <input id="usuario" name="username" type="text" class="form-control"
                            [(ngModel)]="usuario.usuario" placeholder="Tu usuario" autocomplete="username"
                            autocapitalize="none" spellcheck="false" autofocus [disabled]="cargando">
                    </div>
                </div>

                <div class="tm-field">
                    <label for="password">{{ passwordTitle }}</label>
                    <div class="tm-input-icon tm-input-icon--action">
                        <i class="fas fa-lock" aria-hidden="true"></i>
                        <input id="password" name="password" [type]="verPassword ? 'text' : 'password'"
                            class="form-control" [(ngModel)]="usuario.password" placeholder="Tu contraseña"
                            autocomplete="current-password" [disabled]="cargando">
                        <button type="button" class="tm-input-icon__action" (click)="verPassword = !verPassword"
                            [attr.aria-pressed]="verPassword"
                            [attr.aria-label]="verPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                            <i class="fas" [ngClass]="verPassword ? 'fa-eye-slash' : 'fa-eye'" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="login__alert" *ngIf="error" role="alert">
                    <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                    <span>{{ error }}</span>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block login__submit" [disabled]="cargando">
                    <span class="login__spinner" *ngIf="cargando" aria-hidden="true"></span>
                    {{ cargando ? 'Ingresando…' : 'Entrar' }}
                    <i class="fas fa-arrow-right" *ngIf="!cargando" aria-hidden="true"></i>
                </button>
            </form>
        </div>

        <footer class="login__foot">
            Punto de venta e inventario
        </footer>
    </section>

    <!-- MARCA (derecha) -->
    <aside class="login__brand">
        <div class="login__rays" aria-hidden="true"></div>
        <div class="login__glow" aria-hidden="true"></div>

        <div class="login__brand-content">
            <app-logo variant="light" layout="stacked" size="xl" [slogan]="true"></app-logo>
        </div>
    </aside>
</main>
