<!-- Content Header (Page header) -->
<section class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1>{{title}}</h1>
                <br>
                <a [routerLink]="['/productos/marcas/create']" class="btn bg-gradient-success">
                    <i class="fas fa-plus-circle"></i>
                    Nuevo
                </a>
            </div>
        </div>
    </div><!-- /.container-fluid -->
</section>

<div class="card">
    <div class="card-header">
        Listado de Tipos de Identificación
    </div>
    <div class="card-body table-responsive">

        <div class="row mb-2">
            <div class="col-md-4 ml-md-auto tm-buscador">
                <i class="fas fa-search"></i>
                <input type="search" class="form-control form-control-sm" placeholder="Buscar..."
                    [ngModel]="search" (ngModelChange)="onBuscar($event)">
                <span class="tm-spinner" *ngIf="cargando"></span>
            </div>
        </div>

        <app-sin-registros *ngIf="marcas?.length == 0 && !cargando" entidad="marcas" [busqueda]="search"
            (limpiar)="onBuscar('')"></app-sin-registros>

        <div class="tabla-wrap">
            <div class="tabla-progreso" *ngIf="cargando && marcas?.length"></div>
            <app-tabla-skeleton *ngIf="cargando && !marcas?.length" [columnas]="5"></app-tabla-skeleton>
            <table id="marcas" class="table table-modern" [class.cargando]="cargando"
            *ngIf="marcas?.length > 0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Marca</th>
                    <th>Fecha Registro</th>
                    <th>Creador</th>
                    <th>Opciones</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let marca of marcas">
                    <td data-label="ID">{{marca.idMarcaProducto}}</td>
                    <td data-label="Marca">{{marca.marca}}</td>
                    <td data-label="Fecha Registro">{{marca.fechaRegistro | date: 'dd/MM/yyyy - hh:mm'}}</td>
                    <td data-label="Creador">{{marca.usuario.usuario}}</td>
                    <td data-label="Opciones" class="center-options" *ngIf="auth.hasRole('ROLE_ADMIN') || auth.hasRole('ROLE_INVENTARIO')">

                        <button class="btn bg-gradient-info margin" type="button" name="edit" placement="top" ngbTooltip="Editar Marca"
                            [routerLink]="['/productos/marcas/create', marca.idMarcaProducto]">

                            <i class="fas fa-edit"></i>
                        </button>&nbsp;

                        <button class="btn bg-gradient-danger margin" type="button" name="delete" placement="top" ngbTooltip="Eliminar"
                            (click)="delete(marca)">

                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>

        <app-paginacion [page]="page" [size]="size" [totalElements]="totalElements" [totalPages]="totalPages"
            (pageChange)="onPageChange($event)" (sizeChange)="onSizeChange($event)"></app-paginacion>
    </div>
</div>
