<div class="row align-items-center mt-2">
    <div class="col-md-4 mb-2">
        <label class="mb-0 font-weight-normal">
            Mostrar
            <select class="custom-select custom-select-sm w-auto mx-1" [ngModel]="size"
                (ngModelChange)="cambiarTamanio($event)">
                <option *ngFor="let s of sizes" [value]="s">{{s}}</option>
            </select>
            registros
        </label>
    </div>
    <div class="col-md-4 mb-2 text-center">
        Mostrando registros del {{desde}} al {{hasta}} de un total de {{totalElements}} registros
    </div>
    <div class="col-md-4 mb-2">
        <ul class="pagination pagination-sm justify-content-md-end mb-0" *ngIf="totalPages > 1">
            <li class="page-item" [class.disabled]="page === 0">
                <a class="page-link" href="javascript:void(0)" (click)="ir(0)">Primero</a>
            </li>
            <li class="page-item" [class.disabled]="page === 0">
                <a class="page-link" href="javascript:void(0)" (click)="ir(page - 1)">Anterior</a>
            </li>
            <li class="page-item" *ngFor="let p of paginas" [class.active]="p === page">
                <a class="page-link" href="javascript:void(0)" (click)="ir(p)">{{p + 1}}</a>
            </li>
            <li class="page-item" [class.disabled]="page >= totalPages - 1">
                <a class="page-link" href="javascript:void(0)" (click)="ir(page + 1)">Siguiente</a>
            </li>
            <li class="page-item" [class.disabled]="page >= totalPages - 1">
                <a class="page-link" href="javascript:void(0)" (click)="ir(totalPages - 1)">Último</a>
            </li>
        </ul>
    </div>
</div>
