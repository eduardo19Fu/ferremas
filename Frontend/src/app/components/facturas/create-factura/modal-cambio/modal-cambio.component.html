<div *ngIf="modalCambioService.modal" class="abrir-modal animacion fadeIn">
    <div class="modal" tabindex="-1" style="display: block; overflow-y: scroll;">
        <div class="modal-dialog modal-lg">
            <div class="modal-content tm-form">
                <div class="modal-header">
                    <h5 class="modal-title ">{{title}}</h5>
                    <button (click)="cerrarModal()" id="close" type="button" class="close" data-dismiss="modal"
                        aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <div class="modal-body">
                    <form #clienteForm="ngForm" class="tm-stack">
                        <div class="tm-total">
                            <span class="tm-total-label">Total</span>
                            <span class="tm-total-amount">{{factura.total}}</span>
                        </div>

                        <div class="tm-field">
                            <label for="efectivo">Efectivo</label>
                            <input type="number" name="efectivo" id="efectivo" class="form-control"
                                (keyup)="calcularCambio($event)">
                        </div>

                        <div class="tm-total tm-total--neutral">
                            <span class="tm-total-label">Cambio</span>
                            <span class="tm-total-amount">{{cambio}}</span>
                        </div>

                        <button type="submit" role="button" class="btn btn-primary btn-lg btn-block" (click)="create()"
                            [disabled]="!clienteForm.form.valid">
                            Guardar
                        </button>
                    </form>
                </div>

                <div class="modal-footer">
                    <button (click)="cerrarModal()" type="button" class="btn btn-secondary"
                        data-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
</div>
