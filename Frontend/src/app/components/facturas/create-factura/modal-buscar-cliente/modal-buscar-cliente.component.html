<div class="modal fade" id="modal-buscar-cliente">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header header-modal" style="background-color: rebeccapurple;">
                <h4 class="modal-title" style="color: #ffffff">{{title}}</h4>
                <button #myButton2XChild type="button" name="button-2x" id="button-2x" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="card-body">
                <div class="modal-body table-responsive">
                    <div class="row mb-2">
                        <div class="col-md-5 ml-md-auto">
                            <input type="search" class="form-control form-control-sm" placeholder="Buscar por nombre o NIT..."
                                [ngModel]="search" (ngModelChange)="onBuscar($event)">
                        </div>
                    </div>

                    <table id="clientes"
                        class="table table-hover table-striped table-bordered table-sm"
                        *ngIf="clientes?.length > 0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>NIT</th>
                                <th>Dirección</th>
                                <th>Opciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr *ngFor="let cliente of clientes">
                                <td>{{cliente.idCliente}}</td>
                                <td>{{cliente.nombre}}</td>
                                <td>{{cliente.nit}}</td>
                                <td>{{cliente.direccion}}</td>
                                <td class="center-options">
                                    <button class="btn bg-gradient-cyan" (click)="chooseCliente(cliente)">
                                        Elegir
                                    </button>
                                </td>
                            </tr>
                        </tbody>

                    </table>

                    <div class="alert alert-info" *ngIf="items.length === 0 && !cargando">No se encontraron registros.</div>

                    <app-paginacion [page]="page" [size]="size" [totalElements]="totalElements" [totalPages]="totalPages"
                        (pageChange)="onPageChange($event)" (sizeChange)="onSizeChange($event)"></app-paginacion>
                </div>
            </div>
        </div>
    </div>
</div>
