<div class="modal fade" id="modal-buscar-cliente">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header header-modal" style="background-color: rebeccapurple;">
                <h4 class="modal-title" style="color: #ffffff">{{title}}</h4>
                <button #myButton2XChild type="button" name="button-2x" id="button-2x" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="card-body">
                <div class="modal-body table-responsive">
                    <div class="row mb-2">
                        <div class="col-md-5 ml-md-auto tm-buscador">
                            <i class="fas fa-search"></i>
                <input type="search" class="form-control form-control-sm" placeholder="Buscar por nombre o NIT..."
                                [ngModel]="search" (ngModelChange)="onBuscar($event)">
                <span class="tm-spinner" *ngIf="cargando"></span>
                        </div>
                    </div>

                    <div class="tabla-wrap">
            <div class="tabla-progreso" *ngIf="cargando && clientes?.length"></div>
            <app-tabla-skeleton *ngIf="cargando && !clientes?.length" [columnas]="5"></app-tabla-skeleton>
            <table id="clientes"
                        class="table table-modern" [class.cargando]="cargando"
                        *ngIf="clientes?.length > 0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>NIT</th>
                                <th>Dirección</th>
                                <th>Opciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr *ngFor="let cliente of clientes">
                                <td data-label="ID">{{cliente.idCliente}}</td>
                                <td data-label="Nombre">{{cliente.nombre}}</td>
                                <td data-label="NIT">{{cliente.nit}}</td>
                                <td data-label="Dirección">{{cliente.direccion}}</td>
                                <td data-label="Opciones" class="center-options">
                                    <button class="btn bg-gradient-cyan" (click)="chooseCliente(cliente)">
                                        Elegir
                                    </button>
                                </td>
                            </tr>
                        </tbody>

                    </table>
        </div>

                    <app-sin-registros *ngIf="items.length === 0 && !cargando" entidad="facturas" [busqueda]="search"
                        (limpiar)="onBuscar('')"></app-sin-registros>

                    <app-paginacion [page]="page" [size]="size" [totalElements]="totalElements" [totalPages]="totalPages"
                        (pageChange)="onPageChange($event)" (sizeChange)="onSizeChange($event)"></app-paginacion>
                </div>
            </div>
        </div>
    </div>
</div>
