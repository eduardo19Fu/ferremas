<!-- VENTANA MODAL DEL DETALLE DEL USUARIO -->
<app-detail-usuario *ngIf="usuarioSeleccionado" [usuario]="usuarioSeleccionado"></app-detail-usuario>

<!-- Content Header (Page header) -->
<section class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1>{{title}}</h1>
                <br>
                <a [routerLink]="['/usuarios/create']" class="btn bg-gradient-success">
                    <i class="fas fa-plus-circle"></i>
                    Nuevo
                </a>
            </div>
        </div>
    </div><!-- /.container-fluid -->
</section>

<div class="card">
<div class="card-body table-responsive">

        <div class="row mb-2">
            <div class="col-md-auto tm-toolbar-size">
                <app-tamanio-pagina [size]="size" (sizeChange)="onSizeChange($event)"></app-tamanio-pagina>
            </div>
            <div class="col-md-4 ml-md-auto tm-buscador">
                <i class="fas fa-search"></i>
                <input type="search" class="form-control form-control-sm" placeholder="Buscar..."
                    [ngModel]="search" (ngModelChange)="onBuscar($event)">
                <span class="tm-spinner" *ngIf="cargando"></span>
            </div>
        </div>

        <app-sin-registros *ngIf="usuarios?.length == 0 && !cargando" entidad="usuarios" [busqueda]="search"
            (limpiar)="onBuscar('')"></app-sin-registros>

        <div class="tabla-wrap">
            <div class="tabla-progreso" *ngIf="cargando && usuarios?.length"></div>
            <app-tabla-skeleton *ngIf="cargando && !usuarios?.length" [columnas]="6"></app-tabla-skeleton>
            <table id="usuarios" class="table table-modern" [class.cargando]="cargando" 
            *ngIf="usuarios?.length > 0">

            <thead>
                <tr>
                    <th tmSortable="idUsuario" [sort]="sort" (tmSort)="onSort($event)">ID</th>
                    <th tmSortable="usuario" [sort]="sort" (tmSort)="onSort($event)">Usuario</th>
                    <th tmSortable="primerNombre" [sort]="sort" (tmSort)="onSort($event)">Nombre</th>
                    <th tmSortable="apellido" [sort]="sort" (tmSort)="onSort($event)">Apellido</th>
                    <th tmSortable="fechaRegistro" [sort]="sort" (tmSort)="onSort($event)">Fecha Registro</th>
                    <th>Opciones</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let usuario of usuarios">
                    <td data-label="ID">{{usuario.idUsuario}}</td>
                    <td data-label="Usuario">{{usuario.usuario}}</td>
                    <td data-label="Nombre">{{usuario.primerNombre + ' ' + (usuario.segundoNombre == null ? '': usuario.segundoNombre)}}</td>
                    <td data-label="Apellido">{{usuario.apellido}}</td>
                    <td data-label="Fecha Registro">{{usuario.fechaRegistro | date: 'dd/MM/yyyy - hh:mm'}}</td>
                    <td data-label="Opciones" class="center-options">

                        <button type="button" class="btn bg-gradient-info" name="edit" placement="top" ngbTooltip="Editar Usuario"
                            [routerLink]="['/usuarios/create', usuario.idUsuario]">
                            <i class="fas fa-edit"></i>
                        </button>&nbsp;

                        <button type="button" class="btn bg-gradient-success" placement="top" ngbTooltip="Detalle del Usuario"
                            (click)="abrirDetalle(usuario)">
                            <i class="fas fa-asterisk"></i>
                        </button>&nbsp;

                        <!-- Aquí va el botón de eliminar -->
                        <button type="button" class="btn bg-gradient-danger" name="delete" placement="top" ngbTooltip="Eliminar Usuario"
                            (click)="delete(usuario)">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>

        <app-paginacion [mostrarTamanio]="false" [page]="page" [size]="size" [totalElements]="totalElements" [totalPages]="totalPages"
            (pageChange)="onPageChange($event)" (sizeChange)="onSizeChange($event)"></app-paginacion>
    </div>
</div>
