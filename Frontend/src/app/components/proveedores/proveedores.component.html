<!-- Content Header (Page header) -->
<section class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1>{{title}}</h1>
                <br>
                <a [routerLink]="['/proveedores/create']" class="btn bg-gradient-success">
                    <i class="fas fa-plus-circle"></i>
                    Nuevo
                </a>
            </div>
        </div>
    </div><!-- /.container-fluid -->
</section>

<div class="card">
<div class="card-body table-responsive">
        <div class="row mb-2">
            <div class="col-md-auto tm-toolbar-size">
                <app-tamanio-pagina [size]="size" (sizeChange)="onSizeChange($event)"></app-tamanio-pagina>
            </div>
            <div class="col-md-4 ml-md-auto tm-buscador">
                <i class="fas fa-search"></i>
                <input type="search" class="form-control form-control-sm" placeholder="Buscar..."
                    [ngModel]="search" (ngModelChange)="onBuscar($event)">
                <span class="tm-spinner" *ngIf="cargando"></span>
            </div>
        </div>

        <app-sin-registros *ngIf="proveedores?.length === 0 && !cargando" entidad="proveedores" [busqueda]="search"
            (limpiar)="onBuscar('')"></app-sin-registros>

        <div class="tabla-wrap">
            <div class="tabla-progreso" *ngIf="cargando && proveedores?.length"></div>
            <app-tabla-skeleton *ngIf="cargando && !proveedores?.length" [columnas]="9"></app-tabla-skeleton>
            <table id="proveedores" class="table table-modern" [class.cargando]="cargando"
            *ngIf="proveedores?.length > 0">
            <thead>
                <tr>
                    <th tmSortable="idProveedor" [sort]="sort" (tmSort)="onSort($event)">#</th>
                    <th tmSortable="contacto" [sort]="sort" (tmSort)="onSort($event)">Contacto</th>
                    <th tmSortable="pais.nombre" [sort]="sort" (tmSort)="onSort($event)">Pais</th>
                    <th tmSortable="web" [sort]="sort" (tmSort)="onSort($event)">Web</th>
                    <th tmSortable="email" [sort]="sort" (tmSort)="onSort($event)">E-mail</th>
                    <th tmSortable="telefono" [sort]="sort" (tmSort)="onSort($event)">Teléfono</th>
                    <th tmSortable="direccion" [sort]="sort" (tmSort)="onSort($event)">Dirección</th>
                    <th tmSortable="estado.estado" [sort]="sort" (tmSort)="onSort($event)">Estado</th>
                    <th>Opciones</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let proveedor of proveedores">
                    <td data-label="#">{{proveedor.idProveedor}}</td>
                    <td data-label="Contacto">{{proveedor.contacto}}</td>
                    <td data-label="Pais">{{proveedor.pais.nombre}}</td>
                    <td data-label="Web">{{proveedor.web}}</td>
                    <td data-label="E-mail">{{proveedor.email}}</td>
                    <td data-label="Teléfono">{{proveedor.telefono}}</td>
                    <td data-label="Dirección">{{proveedor.direccion}}</td>
                    <td data-label="Estado">
                        <span class="badge"
                            [ngClass]="{'badge-primary': proveedor.estado.estado === 'ACTIVO', 'badge-danger': proveedor.estado.estado === 'INACTIVO'}">
                            {{proveedor.estado.estado}}
                        </span>
                    </td>
                    <td data-label="Opciones" class="center-options">
                        <button class="btn bg-gradient-info margin" placement="top" ngbTooltip="Editar"
                            [routerLink]="['/proveedor/create', proveedor.idProveedor]" 
                            *ngIf="auth.hasRole('ROLE_ADMIN') || auth.hasRole('ROLE_INVENTARIO')">
                            <i class="fas fa-edit"></i>
                        </button>

                        <button class="btn bg-gradient-danger margin" placement="top" ngbTooltip="Eliminar"
                            *ngIf="auth.hasRole('ROLE_ADMIN') || auth.hasRole('ROLE_INVENTARIO')" (click)="delete(proveedor)">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>

        <app-paginacion [mostrarTamanio]="false" [page]="page" [size]="size" [totalElements]="totalElements" [totalPages]="totalPages"
            (pageChange)="onPageChange($event)" (sizeChange)="onSizeChange($event)"></app-paginacion>
    </div>
</div>
