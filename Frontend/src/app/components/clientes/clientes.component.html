<!-- Content Header (Page header) -->
<section class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1>{{title}}</h1>
                <br>
                <a *ngIf="auth.hasRole('ROLE_ADMIN') || auth.hasRole('ROLE_COBRADOR')"
                    [routerLink]="['/clientes/create']" class="btn bg-gradient-success">
                    <i class="fas fa-plus-circle"></i>
                    Nuevo
                </a>
            </div>
        </div>
    </div><!-- /.container-fluid -->
</section>

<div class="card">
<div class="card-body table-responsive">

        <div class="row mb-2">
            <div class="col-md-auto tm-toolbar-size">
                <app-tamanio-pagina [size]="size" (sizeChange)="onSizeChange($event)"></app-tamanio-pagina>
            </div>
            <div class="col-md-4 ml-md-auto tm-buscador">
                <i class="fas fa-search"></i>
                <input type="search" class="form-control form-control-sm" placeholder="Buscar..."
                    [ngModel]="search" (ngModelChange)="onBuscar($event)">
                <span class="tm-spinner" *ngIf="cargando"></span>
            </div>
        </div>

        <app-sin-registros *ngIf="clientes?.length == 0 && !cargando" entidad="clientes" [busqueda]="search"
            (limpiar)="onBuscar('')"></app-sin-registros>

        <div class="tabla-wrap">
            <div class="tabla-progreso" *ngIf="cargando && clientes?.length"></div>
            <app-tabla-skeleton *ngIf="cargando && !clientes?.length" [columnas]="7"></app-tabla-skeleton>
            <table id="clientes" class="table table-modern" [class.cargando]="cargando" 
            *ngIf="clientes?.length > 0">

            <thead>
                <tr>
                    <th tmSortable="idCliente" [sort]="sort" (tmSort)="onSort($event)">ID</th>
                    <th tmSortable="nombre" [sort]="sort" (tmSort)="onSort($event)">Nombre</th>
                    <th tmSortable="nit" [sort]="sort" (tmSort)="onSort($event)">NIT</th>
                    <th tmSortable="telefono" [sort]="sort" (tmSort)="onSort($event)">Teléfono</th>
                    <th tmSortable="direccion" [sort]="sort" (tmSort)="onSort($event)">Dirección</th>
                    <th tmSortable="fechaRegistro" [sort]="sort" (tmSort)="onSort($event)">Fecha Registro</th>
                    <th *ngIf="auth.hasRole('ROLE_ADMIN') || auth.hasRole('ROLE_COBRADOR')">Opciones</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let cliente of clientes">
                    <td data-label="ID">{{cliente.idCliente}}</td>
                    <td data-label="Nombre">{{cliente.nombre}}</td>
                    <td data-label="NIT">{{cliente.nit}}</td>
                    <td data-label="Teléfono">{{cliente.telefono}}</td>
                    <td data-label="Dirección">{{cliente.direccion}}</td>
                    <td data-label="Fecha Registro">{{cliente.fechaRegistro | date: 'dd/MM/yyyy - hh:mm'}}</td>
                    <td data-label="Opciones" *ngIf="auth.hasRole('ROLE_ADMIN') || auth.hasRole('ROLE_COBRADOR')" class="center-options">

                        <button class="btn bg-gradient-info margin" type="button" name="edit" 
                            placement="top" ngbTooltip="Editar Cliente" title="Editar"
                            [routerLink]="['/clientes/create', cliente.idCliente]">

                            <i class="fas fa-edit"></i>
                        </button>&nbsp;

                        <button class="btn bg-gradient-danger margin" type="button" name="delete" (click)="delete(cliente)"
                        placement="top" ngbTooltip="Eliminar Cliente" title="Eliminar">

                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>

        <app-paginacion [mostrarTamanio]="false" [page]="page" [size]="size" [totalElements]="totalElements" [totalPages]="totalPages"
            (pageChange)="onPageChange($event)" (sizeChange)="onSizeChange($event)"></app-paginacion>
    </div>
</div>
