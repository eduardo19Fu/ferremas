<!-- MODAL PRA BUSCAR PRODUCTO -->
<app-modal-buscar-producto-movimiento (producto)="loadProducto($event)"></app-modal-buscar-producto-movimiento>

<div class="container">
    <!-- Content Header (Page header) -->
    <div class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6">
                    <h1 class="m-0 text-dark">{{title}}</h1>
                </div><!-- /.col -->
            </div><!-- /.row -->
        </div><!-- /.container-fluid -->
    </div>
    <!-- /.content-header -->

    <div class="card tm-form tm-form--medium">
        <div class="card-header">
            <h3 class="card-title">Datos del movimiento</h3>
        </div>

        <form #formMovimiento="ngForm" id="form-movimiento">
            <div class="card-body">

                <!-- PRODUCTO -->
                <section class="tm-section">
                    <h4 class="tm-section-title">Producto</h4>

                    <div class="tm-grid">
                        <div class="tm-field">
                            <label for="cod-producto">Código</label>
                            <div class="tm-input-action">
                                <input type="text" class="form-control" name="cod-producto" id="cod-producto"
                                    [(ngModel)]="producto.codProducto" (keyup.enter)="buscarProducto()"
                                    required #codigo="ngModel">

                                <button type="button" class="btn btn-outline-primary" data-toggle="modal"
                                    data-target="#modal-buscar-producto" aria-label="Buscar producto">
                                    <i class="fas fa-search"></i>
                                </button>
                            </div>
                        </div>

                        <div class="tm-field tm-span-2">
                            <label for="nombre">Producto</label>
                            <input type="text" class="form-control" name="nombre" id="nombre"
                                value="{{producto.nombre ? producto.nombre : ''}}" required
                                [disabled]="producto.nombre">
                        </div>

                        <div class="tm-field">
                            <label for="stock">Disponible</label>
                            <input type="number" class="form-control" name="stock" id="stock"
                                value="{{producto.stock ? producto.stock : ''}}" required [disabled]="producto.stock">
                        </div>
                    </div>
                </section>

                <!-- MOVIMIENTO -->
                <section class="tm-section">
                    <h4 class="tm-section-title">Movimiento</h4>

                    <div class="tm-grid">
                        <div class="tm-field">
                            <label for="cantidad">Cantidad</label>
                            <input type="number" class="form-control" name="cantidad" id="cantidad" required
                                #cantidad="ngModel" [(ngModel)]="movimientoProducto.cantidad">

                            <div *ngIf="cantidad.invalid && (cantidad.touched || cantidad.dirty)">
                                <span class="requerido">
                                    La cantidad no puede estar vacía.
                                </span>
                            </div>
                        </div>

                        <div class="tm-field">
                            <label for="tipo-movimiento">Tipo de movimiento</label>
                            <select name="tipo-movimiento" id="tipo-movimiento" class="form-control"
                                [(ngModel)]="movimientoProducto.tipoMovimiento" required #tipo="ngModel">
                                <option selected="selected" [ngValue]="undefined">Elija tipo de movimiento</option>
                                <option *ngFor="let tipoMovimiento of tiposMovimiento"
                                    [ngValue]="tipoMovimiento">
                                    {{tipoMovimiento.tipoMovimiento}}
                                </option>
                            </select>

                            <div *ngIf="tipo.invalid && (tipo.touched || tipo.dirty)">
                                <span class="requerido">
                                    Elija un movimiento antes de continuar.
                                </span>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <div class="card-footer">
                <button type="submit" class="btn btn-primary btn-lg" [disabled]="!formMovimiento.form.valid"
                    (click)="create()">
                    Ingresar movimiento
                </button>
            </div>
        </form>
    </div>
</div>
