<!-- MODAL PARA BUSQUEDA DE NOTAS DE CREDITO -->
<app-modal-notas-credito (notaCredito)="cargarNotaCredito($event)"></app-modal-notas-credito>

<!-- Content Header (Page header) -->
<div class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1 class="m-0 text-dark">{{title}}</h1>
            </div><!-- /.col -->
        </div><!-- /.row -->
    </div><!-- /.container-fluid -->
</div>
<!-- /.content-header -->

<div class="card tm-form tm-form--medium">
    <div class="card-header">
        <h3 class="card-title">Datos del pago</h3>
    </div>

    <form>
        <div class="card-body">

            <!-- CLIENTE Y BUSQUEDA DE LA NOTA DE CREDITO -->
            <section class="tm-section">
                <h4 class="tm-section-title">Cliente</h4>

                <div class="tm-grid">
                    <div class="tm-field">
                        <label for="cliente">Cliente</label>
                        <input class="form-control" type="text" name="usuario" id="cliente"
                            value="{{cliente.nombre}}" [disabled]="cliente">
                    </div>

                    <div class="tm-field">
                        <label for="buscar">Buscar nota de crédito</label>
                        <div class="tm-input-action">
                            <input #mybuscar type="text" id="buscar" name="buscar" class="form-control">

                            <button type="button" role="button" class="btn btn-outline-primary" data-toggle="modal"
                                data-target="#modal-notas-credito" aria-label="Buscar nota de crédito">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- NOTA DE CREDITO SELECCIONADA -->
            <section class="tm-section">
                <h4 class="tm-section-title">Nota de crédito</h4>

                <div class="tm-grid">
                    <div class="tm-field">
                        <label for="id-nota-credito">Nota de crédito</label>
                        <input type="text" class="form-control" name="id-nota-credito" id="id-nota-credito"
                            [(ngModel)]="notaCredito.idNotaCredito" disabled>
                    </div>

                    <div class="tm-field">
                        <label for="fecha-creacion">Fecha de creación</label>
                        <input type="text" class="form-control" name="fecha-creacion" id="fecha-creacion"
                            value="{{notaCredito.fechaCreacion | date: 'dd-MM-yyyy HH:mm'}}" disabled>
                    </div>

                    <div class="tm-field">
                        <label for="restante">Saldo restante</label>
                        <input type="text" class="form-control" name="restante" id="restante"
                            value="{{notaCredito.restante | currency: 'Q' : 'symbol'}}">
                    </div>
                </div>
            </section>

            <!-- PAGO -->
            <section class="tm-section">
                <h4 class="tm-section-title">Pago</h4>

                <div class="tm-grid">
                    <div class="tm-field">
                        <label for="monto">Monto</label>
                        <input type="number" class="form-control" name="nombre" id="monto"
                            [(ngModel)]="pagoParcial.pago">
                    </div>
                </div>
            </section>
        </div>

        <div class="card-footer">
            <button type="submit" class="btn btn-primary btn-lg" (click)="createPagoParcial()">
                Guardar pago
            </button>
        </div>
    </form>
</div>
